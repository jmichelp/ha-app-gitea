name: Update Gitea Version

on:
  workflow_call:
    inputs:
      upstream_version:
        description: "Upstream Gitea package version from Alpine"
        type: string
        required: false
      current_version:
        description: "Current Gitea package version running in Docker"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream Gitea package version (optional, auto-detected if empty)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  create-pr:
    name: Bump version and create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Gitea versions
        id: versions
        env:
          INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          INPUT_CURRENT_VERSION: ${{ inputs.current_version }}
        run: |
          UPSTREAM_VER="$INPUT_UPSTREAM_VERSION"
          CURRENT_VER="$INPUT_CURRENT_VERSION"

          if [ -z "$UPSTREAM_VER" ]; then
            echo "Upstream version not provided, detecting from Alpine base image..."
            docker pull ghcr.io/home-assistant/base:latest
            UPSTREAM_VER=$(docker run --rm --entrypoint /bin/sh ghcr.io/home-assistant/base:latest -c '
              apk update >/dev/null 2>&1 || exit 1
              v=$(apk list gitea 2>/dev/null | sed -n "s/^gitea-\([0-9][^ ]*\).*/\1/p" | head -n1)
              if [ -z "$v" ]; then
                v=$(apk search -x -v gitea 2>/dev/null | sed -n "s/^gitea-\([0-9][^ ]*\).*/\1/p" | head -n1)
              fi
              printf "%s" "$v"
            ')
          fi

          if [ -z "$CURRENT_VER" ]; then
            DOCKER_IMAGE=""
            for candidate in "ghcr.io/jmichelp/app-gitea:latest" "ghcr.io/jmichelp/app-gitea:amd64-latest"; do
              if docker pull "$candidate" 2>/dev/null; then
                DOCKER_IMAGE="$candidate"
                break
              fi
            done

            if [ -n "$DOCKER_IMAGE" ]; then
              CURRENT_VER=$(docker run --rm --entrypoint /bin/sh "$DOCKER_IMAGE" -c '
                v=$(apk list -I gitea 2>/dev/null | sed -n "s/^gitea-\([0-9][^ ]*\).*/\1/p" | head -n1)
                if [ -z "$v" ]; then
                  v=$(apk info -e -v gitea 2>/dev/null | sed -n "s/^gitea-\([0-9][^ ]*\).*/\1/p" | head -n1)
                fi
                printf "%s" "$v"
              ' 2>/dev/null || true)

              if [ -z "$CURRENT_VER" ]; then
                CURRENT_VER=$(docker run --rm --entrypoint gitea "$DOCKER_IMAGE" --version 2>/dev/null | awk '/^Gitea version / {print $3; exit}' || true)
              fi
            fi

            if [ -z "$CURRENT_VER" ] && [ -f "gitea/CHANGELOG.md" ]; then
              CURRENT_VER=$(grep -oE "Update Gitea to [^ ]+" gitea/CHANGELOG.md | head -n1 | sed 's/Update Gitea to //' || true)
            fi
          fi

          echo "upstream_version=${UPSTREAM_VER}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VER:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Bump minor version and update changelog
        id: bump
        run: |
          python3 .github/scripts/bump-version.py \
            --upstream-version "${{ steps.versions.outputs.upstream_version }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitea): update Gitea to ${{ steps.versions.outputs.upstream_version }}"
          title: "Update Gitea to ${{ steps.versions.outputs.upstream_version }}"
          body: |
            ## Automated Gitea Version Update

            A new version of the Gitea package was detected in Alpine Linux: **${{ steps.versions.outputs.upstream_version }}** (currently deployed: **${{ steps.versions.outputs.current_version }}**).

            ### Changes
            - Bump minor version to `${{ steps.bump.outputs.new_addon_version }}` in `gitea/config.yaml`
            - Document update to Gitea `${{ steps.versions.outputs.upstream_version }}` in `gitea/CHANGELOG.md`

            When this pull request is merged to `main`, the build workflow will automatically build and publish the updated Docker image tagged as `${{ steps.bump.outputs.new_addon_version }}` and `latest`.
          branch: "update-gitea-${{ steps.bump.outputs.new_addon_version }}"
          delete-branch: true
          base: main
