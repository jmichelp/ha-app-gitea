name: Update Package Versions

on:
  workflow_call:
    inputs:
      bump_type:
        description: "Version bump type (minor if gitea updated, patch otherwise)"
        type: string
        required: false
      updated_packages:
        description: "JSON array of updated Alpine packages"
        type: string
        required: false
      upstream_version:
        description: "Upstream Gitea package version from Alpine"
        type: string
        required: false
      current_version:
        description: "Current Gitea package version running in Docker"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Manual Gitea version override (optional; leave empty to auto-detect all Dockerfile packages)"
        type: string
        required: false
      bump_type:
        description: "Version bump type (auto = minor iff gitea updated, else patch)"
        type: choice
        options:
          - auto
          - minor
          - patch
        default: auto
        required: false

permissions:
  contents: read

jobs:
  create-pr:
    name: Bump version and create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package updates
        id: versions
        env:
          INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
          INPUT_UPDATED_PACKAGES: ${{ inputs.updated_packages }}
          INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          INPUT_CURRENT_VERSION: ${{ inputs.current_version }}
        run: |
          if [ -n "$INPUT_UPDATED_PACKAGES" ] && [ "$INPUT_UPDATED_PACKAGES" != "[]" ]; then
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "updated_packages=$INPUT_UPDATED_PACKAGES" >> "$GITHUB_OUTPUT"
            echo "bump_type=${INPUT_BUMP_TYPE:-auto}" >> "$GITHUB_OUTPUT"
            echo "upstream_version=$INPUT_UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
            echo "current_version=$INPUT_CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_UPSTREAM_VERSION" ]; then
            echo "update_available=true" >> "$GITHUB_OUTPUT"
            echo "updated_packages=" >> "$GITHUB_OUTPUT"
            echo "bump_type=${INPUT_BUMP_TYPE:-auto}" >> "$GITHUB_OUTPUT"
            echo "upstream_version=$INPUT_UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
            echo "current_version=${INPUT_CURRENT_VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "No package updates provided; detecting updates from gitea/Dockerfile..."
            python3 .github/scripts/check-upstream.py \
              --dockerfile gitea/Dockerfile \
              --changelog gitea/CHANGELOG.md
            if [ "$INPUT_BUMP_TYPE" = "minor" ] || [ "$INPUT_BUMP_TYPE" = "patch" ]; then
              echo "bump_type=$INPUT_BUMP_TYPE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump version and update changelog
        id: bump
        if: steps.versions.outputs.update_available == 'true'
        env:
          BUMP_TYPE: ${{ steps.versions.outputs.bump_type }}
          UPDATED_PACKAGES: ${{ steps.versions.outputs.updated_packages }}
          UPSTREAM_VERSION: ${{ steps.versions.outputs.upstream_version }}
          CURRENT_VERSION: ${{ steps.versions.outputs.current_version }}
        run: |
          set -- --bump-type "${BUMP_TYPE:-auto}"
          if [ -n "$UPDATED_PACKAGES" ]; then
            set -- "$@" --updated-packages "$UPDATED_PACKAGES"
          else
            set -- "$@" --upstream-version "$UPSTREAM_VERSION" --current-version "$CURRENT_VERSION"
          fi
          python3 .github/scripts/bump-version.py "$@"

      - name: Create Pull Request
        if: steps.versions.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.bump.outputs.commit_message }}
          title: ${{ steps.bump.outputs.pr_title }}
          body: ${{ steps.bump.outputs.pr_body }}
          branch: "update-gitea-${{ steps.bump.outputs.new_addon_version }}"
          delete-branch: true
          base: main
