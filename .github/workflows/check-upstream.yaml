name: Check Upstream Package Versions

on:
  schedule:
    # Run monthly on the 1st of every month at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check for Alpine package updates
    runs-on: ubuntu-latest
    outputs:
      update_available: ${{ steps.check.outputs.update_available }}
      bump_type: ${{ steps.check.outputs.bump_type }}
      gitea_updated: ${{ steps.check.outputs.gitea_updated }}
      updated_packages: ${{ steps.check.outputs.updated_packages }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check upstream Alpine and Docker package versions
        id: check
        run: |
          python3 .github/scripts/check-upstream.py \
            --dockerfile gitea/Dockerfile \
            --changelog gitea/CHANGELOG.md

  update:
    name: Trigger update workflow
    needs: check
    if: needs.check.outputs.update_available == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-version.yaml
    with:
      bump_type: ${{ needs.check.outputs.bump_type }}
      updated_packages: ${{ needs.check.outputs.updated_packages }}
      upstream_version: ${{ needs.check.outputs.upstream_version }}
      current_version: ${{ needs.check.outputs.current_version }}
    secrets: inherit
